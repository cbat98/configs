set-option -g prefix C-Space
bind C-Space send-prefix

set-option -g base-index 1

# When the attached session is killed, jump to another session instead of leaving tmux.
# (If no other sessions exist, the client still detaches.)
set -g detach-on-destroy off

# Use tmux's own terminfo inside panes (not xterm*). Stops many hosts from sending
# xterm DA/SDA queries whose replies can leak as visible text on ConPTY/Windows Terminal + SSH.
set -g default-terminal "tmux-256color"
set -s escape-time 0

set -g mode-keys vi
set -g status-position top
set -g status-justify left
set -g status-style "bg=default"
set -g status-left "TMUX: "
set -g window-status-current-style "fg=blue,bold"
set -g status-right ""

# c = new window in home; C = new window in pane's cwd
bind c new-window -c ~
bind C new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
